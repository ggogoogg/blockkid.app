                audioRef.current.pause();
              } else {
                audioRef.current.play();
              }
              setIsPlaying(!isPlaying);
            } else {
              setCurrentTrack(track);
              setIsPlaying(true);
            }
          };

          const playNext = () => {
            if (!currentTrack || tracks.length === 0) return;
            const currentIndex = tracks.findIndex(t => t.id === currentTrack.id);
            const nextIndex = (currentIndex + 1) % tracks.length;
            setCurrentTrack(tracks[nextIndex]);
            setIsPlaying(true);
          };

          const playPrev = () => {
            if (!currentTrack || tracks.length === 0) return;
            const currentIndex = tracks.findIndex(t => t.id === currentTrack.id);
            const prevIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            setCurrentTrack(tracks[prevIndex]);
            setIsPlaying(true);
          };

          useEffect(() => {
            if (currentTrack && audioRef.current) {
              audioRef.current.src = currentTrack.id;
              audioRef.current.play().catch(e => {
                console.warn('Playback failed', e);
                setIsPlaying(false);
              });
            }
          }, [currentTrack]);

          useEffect(() => {
            if (audioRef.current) {
              audioRef.current.volume = volume;
              audioRef.current.muted = isMuted;
            }
          }, [volume, isMuted]);

          return (
            <div className="h-[100dvh] bg-[#1e0505] p-3 md:p-6 lg:p-8 font-sans flex flex-col md:flex-row gap-3 md:gap-6 relative overflow-hidden">
              <audio 
                ref={audioRef}
                onEnded={playNext}
                onPause={() => setIsPlaying(false)}
                onPlay={() => setIsPlaying(true)}
              />

              <nav className="md:w-64 flex-shrink-0 flex flex-col gap-2 md:gap-4 z-10 pt-1 md:pt-0">
                <div className="bg-[#2b0808] border border-[#380b0b] rounded-[24px] md:rounded-[32px] p-4 md:p-6 flex items-center gap-3 shadow-sm justify-center md:justify-start">
                  <div className="w-10 h-10 bg-[#5c1212] rounded-full flex items-center justify-center shrink-0">
                    <Play size={20} className="text-[#ffcccc] ml-1" fill="currentColor" />
                  </div>
                  <h1 className="text-lg md:text-xl font-bold text-[#ffcccc] tracking-tight hidden md:block">blockkid music</h1>
                </div>

                <div className="bg-[#2b0808] border border-[#380b0b] rounded-[24px] md:rounded-[32px] p-2 md:p-3 flex flex-row md:flex-col gap-1 md:gap-2 shadow-sm flex-shrink-0 justify-around md:justify-start">
                  {tabs.map((tab) => {
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`
                          flex items-center gap-2 md:gap-4 px-4 md:px-5 py-3 md:py-4 rounded-full font-medium transition-all duration-300 flex-1 md:flex-none justify-center md:justify-start
                          ${isActive ? 'bg-[#5c1212] text-[#ffcccc] shadow-md border border-[#801a1a]' : 'bg-transparent text-[#cc8080] hover:bg-[#380b0b] hover:text-[#ffcccc]'}
                        `}
                      >
                        {tab.icon}
                        <span className="hidden md:block text-base">{tab.id}</span>
                      </button>
                    );
                  })}
                </div>
              </nav>

              <main className="flex-1 min-h-0 bg-[#2b0808] border border-[#380b0b] rounded-[24px] md:rounded-[32px] shadow-sm p-4 md:p-10 relative z-10">
                {activeTab === 'Home' && <HomeTab />}
                {activeTab === 'My Playlist' && (
                  <PlaylistTab 
                    tracks={tracks} 
                    currentTrack={currentTrack} 
                    isPlaying={isPlaying} 
                    onPlay={handlePlay} 
                    onFileUpload={handleFileUpload}
                  />
                )}
                {activeTab === 'My Profile' && <ProfileTab trackCount={tracks.length} />}
              </main>

              {currentTrack && (
                <div className="fixed bottom-3 md:bottom-8 left-3 right-3 md:left-1/2 md:right-auto md:transform md:-translate-x-1/2 md:w-11/12 max-w-2xl bg-[#4a0d0d] border border-[#6b1515] rounded-[28px] md:rounded-full p-3 md:p-4 px-4 md:px-6 flex items-center justify-between shadow-2xl z-50">
                  <div className="flex items-center gap-3 md:gap-4 min-w-0 flex-1">
                    <div className="w-10 h-10 md:w-12 md:h-12 bg-[#5c1212] rounded-full flex items-center justify-center shrink-0">
                      <Music size={20} className="text-[#ffcccc]" />
                    </div>
                    <div className="min-w-0 pr-2 md:pr-4">
                      <p className="text-[#ffcccc] font-bold truncate text-sm md:text-base">{currentTrack.title}</p>
                      <p className="text-[#cc8080] text-xs md:text-sm truncate">{currentTrack.artist}</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-3 md:gap-4 shrink-0">
                    <button onClick={playPrev} className="text-[#cc8080] hover:text-white transition-colors p-1 md:p-0 hidden sm:block">
                      <SkipBack size={20} fill="currentColor" />
                    </button>
                    <button 
                      onClick={() => handlePlay(currentTrack)} 
                      className="w-12 h-12 md:w-14 md:h-14 bg-[#ffcccc] text-[#4a0d0d] rounded-full flex items-center justify-center hover:scale-105 transition-transform shadow-md shrink-0"
                    >
                      {isPlaying ? <Pause size={20} fill="currentColor" /> : <Play size={20} fill="currentColor" className="ml-1" />}
                    </button>
                    <button onClick={playNext} className="text-[#cc8080] hover:text-white transition-colors p-1 md:p-0">
                      <SkipForward size={20} fill="currentColor" />
                    </button>
                  </div>
                  
                  <div className="hidden sm:flex items-center gap-3 ml-6 shrink-0">
                    <button onClick={() => setIsMuted(!isMuted)} className="text-[#cc8080] hover:text-[#ffcccc] transition-colors">
                      {isMuted || volume === 0 ? <VolumeX size={20} /> : <Volume2 size={20} />}
                    </button>
                    <input 
                      type="range" 
                      min="0" 
                      max="1" 
                      step="0.01" 
                      value={isMuted ? 0 : volume}
                      onChange={(e) => {
                        setVolume(parseFloat(e.target.value));
                        if (isMuted) setIsMuted(false);
                      }}
                      className="w-24 h-2 bg-[#380b0b] rounded-full appearance-none cursor-pointer accent-[#ffcccc]"
                    />
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
